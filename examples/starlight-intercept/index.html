<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="author" content="Travis MacDonald" />
    <meta name="creator" content="Travis MacDonald" />
    <title>Starlight Intercept</title>
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <div class="back-row">
      <a href="../../index.html">← Documentation</a>
    </div>
    <canvas id="game-canvas"></canvas>
    <audio
      id="game-music"
      src="../../assets/GalacticRap.mp3"
      loop
      preload="metadata"
    ></audio>
    <div id="score">0</div>
    <div id="round-progress" aria-label="Sector progress"><i></i></div>
    <div id="message">
      <img
        id="game-logo"
        src="../../assets/starlight-intercept-logo.png"
        alt="Starlight Intercept"
      />
      <h1 hidden>Starlight Intercept</h1>
      <p>Dodge the burning firework fields</p>
      <p class="hint">W / ↑ thrust · S / ↓ dive · A / D move · Space fire</p>
    </div>
    <script src="game.js"></script>
  </body>
</html>
